<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Exam Performance Predictor</title>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            width: 420px;
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 22px;
            margin-bottom: 25px;
        }
        .form-control, .form-select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #43a047;
        }
        h2 {
            text-align: center;
            margin-top: 20px;
            color: #222;
        }
    </style>
</head>
<body>
    <div class="login">
        <h1>Student Exam Performance Predictor</h1>

        <form action="{{ url_for('predict_marks') }}" method="post">

            <label>Gender</label>
            <select class="form-select" name="gender" required>
                <option selected disabled value="">Select your Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label>Race or Ethnicity</label>
            <select class="form-select" name="race_ethnicity" required>
                <option selected disabled value="">Select Ethnicity</option>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
            </select>

            <label>Parental Level of Education</label>
            <select class="form-select" name="parental_level_of_education" required>
                <option selected disabled value="">Select Parent Education</option>
                <option value="some high school">Some High School</option>
                <option value="high school">High School</option>
                <option value="some college">Some College</option>
                <option value="associate's degree">Associate's Degree</option>
                <option value="bachelor's degree">Bachelor's Degree</option>
                <option value="master's degree">Master's Degree</option>
            </select>

            <label>Lunch Type</label>
            <select class="form-select" name="lunch" required>
                <option selected disabled value="">Select Lunch Type</option>
                <option value="standard">Standard</option>
                <option value="free/reduced">Free/Reduced</option>
            </select>

            <label>Test Preparation Course</label>
            <select class="form-select" name="test_preparation_course" required>
                <option selected disabled value="">Select Test Course</option>
                <option value="none">None</option>
                <option value="completed">Completed</option>
            </select>

            <label>Writing Score (out of 100)</label>
            <input class="form-control" type="number" name="writing_score"
                   placeholder="Enter your Writing score" min="0" max="100" required>

            <label>Reading Score (out of 100)</label>
            <input class="form-control" type="number" name="reading_score"
                   placeholder="Enter your Reading score" min="0" max="100" required>

            <br>
            <input class="btn" type="submit" value="Predict your Maths Score">
        </form>

        {% if results %}
        <h2>The predicted score is: {{ results }}</h2>
        {% endif %}
    </div>
</body>
</html>
